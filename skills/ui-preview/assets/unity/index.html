<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEATURE</title>
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
<script src="../kit/kit.js"></script>
<script src="../kit/unity_theme.js"></script>
<script>
// UNITY EXAMPLE: a HUD panel whose colours, sizes and timings start from the project's own files. Replace the paths,
// the names read with get() and draw() with the feature's. Three kinds of group end up in the panel:
//   "uss: Theme"       the .uss custom properties (loadUss); apply_uss.py writes the approved ones back.
//   "asset: HudStyle"  a ScriptableObject's serialized fields (loadAsset); set by hand once approved.
//   "HudPanel"         values that don't exist in the project yet; they become [SerializeField]s.
const USS = "Assets/UI/Theme.uss", ASSET = "Assets/UI/HudStyle.asset"; // from the project root
const FONT = "sans-serif"; // the game's font, declared in ../kit/project.css

Promise.all([UnityTheme.loadUss(USS), UnityTheme.loadAsset(ASSET)]).then(() => Kit.start({
  feature: "FEATURE",
  images: {
    // backdrop: "img/backdrop.png",   // a real game screenshot of this spot, UI hidden
  },
  groups: {
    HudPanel: { note: "HudPanel.cs [SerializeField]s", params: {
      X: { value: 48, min: 0, max: 800, step: 4, unit: "px" },
      Y: { value: 48, min: 0, max: 600, step: 4, unit: "px" },
      Width: { value: 520, min: 200, max: 1000, step: 4, unit: "px" },
      Fill: { value: 0.7, min: 0, max: 1, step: 0.05, hint: "how full the bar is in this mock" },
    } },
    ...UnityTheme.groups(),
  },
  variants: { a: {}, b: { "uss: Theme.--panel-radius": 4, "HudPanel.Width": 680 } },
  draw(ctx, v, s) {
    UnityTheme.use(v);
    const u = name => UnityTheme.get(name);               // the first loaded source with that name
    const a = name => UnityTheme.get(name, "asset: HudStyle"); // this group only
    const p = v.HudPanel, size = u("--font-size-title"), pad = u("--panel-padding");
    const h = pad * 3 + size + 24;

    if (s.images.backdrop) ctx.drawImage(s.images.backdrop, 0, 0);
    else { ctx.fillStyle = "#40454d"; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height); }
    ctx.globalAlpha = s.state === "fading" ? Math.min(1, s.t / a("fadeSeconds")) : 1;

    ctx.fillStyle = u("--color-panel");
    ctx.beginPath(); ctx.roundRect(p.X, p.Y, p.Width, h, u("--panel-radius")); ctx.fill();
    const iconW = a("showIcons") ? size + pad : 0;
    if (iconW) { ctx.fillStyle = a("accentColor"); ctx.fillRect(p.X + pad, p.Y + pad, size, size); }
    ctx.fillStyle = u("--color-text"); ctx.font = `${size}px ${FONT}`; ctx.textBaseline = "top";
    ctx.fillText(a("title"), p.X + pad + iconW, p.Y + pad);
    const barY = p.Y + pad * 2 + size, barW = p.Width - pad * 2;
    ctx.fillStyle = "#00000066"; ctx.fillRect(p.X + pad, barY, barW, 24);
    ctx.fillStyle = u("--color-accent"); ctx.fillRect(p.X + pad, barY, barW * p.Fill, 24);
    ctx.globalAlpha = 1;
  },
}));
</script>
</body>
</html>
