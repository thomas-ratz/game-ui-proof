<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pause menu</title>
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
<script src="../kit/kit.js"></script>
<script src="../scene.js"></script>
<script>
// Neutral demo: three layouts for a pause menu over the demo level, with the agent's recommendation.
const ITEMS = ["Resume", "Options", "Controls", "Quit to title"];
const FONT = "ui-monospace, Consolas, monospace";

Kit.start({
  feature: "pause",
  groups: {
    PauseMenu: { note: "the pause scene's exports", params: {
      Width: { value: 520, min: 320, max: 800, step: 8, unit: "px", hint: "card or sidebar width" },
      TitleSize: { value: 48, options: [32, 40, 48, 64], unit: "px" },
      ItemSize: { value: 32, options: [24, 32, 40], unit: "px" },
      ItemGap: { value: 20, min: 4, max: 48, step: 2, unit: "px" },
      Padding: { value: 48, min: 16, max: 96, step: 4, unit: "px" },
      CornerRadius: { value: 12, min: 0, max: 32, step: 1, unit: "px" },
      Dim: { value: 0.55, min: 0, max: 0.9, step: 0.05, hint: "how dark the level behind gets" },
      FocusSeconds: { value: 0.12, min: 0.04, max: 0.4, step: 0.02, unit: "s", hint: "the focus bar's slide" },
    } },
    "theme: Menu": { note: "theme colours", params: {
      panel: { value: "#14161fee" }, title: { value: "#ffd166ff" }, item: { value: "#e9edf3ff" },
      dim_item: { value: "#e9edf380" }, focus: { value: "#4fd1c5ff" }, focus_text: { value: "#0d1b1eff" },
    } },
  },
  variants: { a: {}, b: { "PauseMenu.Width": 480 }, c: { "PauseMenu.Dim": 0.75 } },
  draw(ctx, v, s) {
    Demo.draw(ctx);
    const m = v.PauseMenu, k = v["theme: Menu"], variant = s.variant;
    ctx.fillStyle = `rgba(8,10,16,${m.Dim})`; ctx.fillRect(0, 0, 1920, 1080);
    const listH = ITEMS.length * m.ItemSize + (ITEMS.length - 1) * m.ItemGap;
    const contentH = m.TitleSize + 40 + listH, h = contentH + 2 * m.Padding;
    let x, y, w = m.Width;
    if (variant === "b") { x = 0; y = 0; ctx.fillStyle = k.panel; ctx.fillRect(0, 0, w, 1080); y = (1080 - contentH) / 2 - m.Padding; }
    else { x = (1920 - w) / 2; y = (1080 - h) / 2; }
    if (variant === "a") { ctx.fillStyle = k.panel; ctx.beginPath(); ctx.roundRect(x, y, w, h, m.CornerRadius); ctx.fill(); }
    const left = x + m.Padding;
    ctx.textBaseline = "middle";
    ctx.fillStyle = k.title; ctx.font = `bold ${m.TitleSize}px ${FONT}`;
    ctx.fillText("PAUSED", left, y + m.Padding + m.TitleSize / 2);
    const steps = s.state === "browse" ? s.t / 0.8 : 0, from = Math.floor(steps) % ITEMS.length;
    const k01 = Math.min(1, (steps % 1) * 0.8 / m.FocusSeconds), to = (from + 1) % ITEMS.length;
    const focus = s.state === "browse" ? from + (to === 0 ? -from : 1) * (k01 * k01 * (3 - 2 * k01)) : 0;
    const top = y + m.Padding + m.TitleSize + 40, rowH = m.ItemSize + m.ItemGap;
    ctx.fillStyle = k.focus;
    ctx.beginPath(); ctx.roundRect(left - 16, top + focus * rowH - m.ItemGap / 2 + 2, w - 2 * m.Padding + 32, m.ItemSize + m.ItemGap - 4, m.CornerRadius / 2); ctx.fill();
    ITEMS.forEach((label, i) => {
      const on = Math.abs(i - focus) < 0.5;
      ctx.fillStyle = on ? k.focus_text : i === 3 ? k.dim_item : k.item;
      ctx.font = `bold ${m.ItemSize}px ${FONT}`;
      ctx.fillText(label, left, top + i * rowH + m.ItemSize / 2);
    });
  },
});
</script>
</body>
</html>
